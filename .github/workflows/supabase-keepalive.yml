name: Supabase Keep-Alive

on:
  schedule:
    # Runs every Monday at 10:00 AM UTC
    - cron: '0 10 * * 1'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase to keep project active
        run: |
          node -e "
          const https = require('https');
          const url = 'https://qdyuftwmeauducfgmrlz.supabase.co/rest/v1/guests_emails?limit=1';
          const key = '${{ secrets.SUPABASE_ANON_KEY }}';
          
          const options = {
            headers: {
              'apikey': key,
              'Authorization': 'Bearer ' + key
            }
          };
          
          https.get(url, options, (res) => {
            console.log('Status:', res.statusCode);
            if (res.statusCode === 200) {
              console.log('✅ Supabase project pinged successfully');
              process.exit(0);
            } else {
              console.error('❌ Unexpected status code:', res.statusCode);
              process.exit(1);
            }
          }).on('error', (err) => {
            console.error('❌ Error:', err.message);
            process.exit(1);
          });
          "

      - name: Log timestamp
        if: success()
        run: echo "✅ Keep-alive completed at $(date)"
